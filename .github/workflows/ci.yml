name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
      # Bootstrap-only until Phase 1 commits uv.lock. Replace this command with
      # `uv sync --frozen --all-groups` in the same commit that adds uv.lock.
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Verify handoff and official sources
        run: |
          uv run python tools/verify_handoff.py
          uv run python tools/audit_source_data.py --check
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy src tests tools
      - name: Test
        run: uv run pytest -q
