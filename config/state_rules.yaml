version: "1.2.0"
rules:
  bond.purchasable_at_as_of:
    version: "2.0.0"
    product_types: ["domestic_bond"]
    description_ko: "미발행 또는 종료 근거가 없으면 구매 가능하다고 가정"
    excludes:
      - field: "issue_date"
        operator: "gt_as_of"
      - field: "maturity_date"
        operator: "lt_as_of"
    missing_maturity_policy: "eligible_with_unverifiable_end_warning"
    ignored_source_fields: ["buyable_quantity"]
  domestic_listed.active_at_as_of:
    version: "1.0.0"
    product_types: ["domestic_etf", "domestic_etn"]
    description_ko: "판매 중, 거래정지 아님, 상장기간 유효"
    conditions:
      - field: "pd_sale_yn"
        operator: "eq"
        value: "1"
      - field: "pd_tr_yn"
        operator: "eq"
        value: "0"
      - field: "pd_lstg_dt"
        operator: "valid_or_lte_as_of"
      - field: "pd_lste_dt"
        operator: "open_ended_or_gte_as_of"
        open_ended_tokens: ["99991231", ""]
