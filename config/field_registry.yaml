version: "1.3.0"
targetless_aggregations: ["count"]
fields:
  product_name:
    product_types: ["domestic_bond", "domestic_etf", "domestic_etn", "overseas_etf", "overseas_etn", "public_fund"]
    value_type: "string"
    operators: ["eq", "contains", "starts_with"]
    sortable: true
    aggregations: []
  product_id:
    product_types: ["domestic_bond", "domestic_etf", "domestic_etn", "overseas_etf", "overseas_etn", "public_fund"]
    value_type: "string"
    operators: ["eq", "in"]
    sortable: true
    aggregations: []
  holding_constituent:
    product_types: ["domestic_etf", "domestic_etn", "overseas_etf", "overseas_etn", "public_fund"]
    value_type: "string"
    operators: ["eq"]
    sortable: false
    aggregations: []
  asset_type:
    product_types: ["domestic_etf", "domestic_etn", "overseas_etf", "overseas_etn"]
    value_type: "string"
    operators: ["eq", "in", "contains"]
    sortable: true
    aggregations: []
  region:
    product_types: ["domestic_etf", "domestic_etn", "overseas_etf", "overseas_etn", "public_fund"]
    value_type: "string"
    operators: ["eq", "in", "contains"]
    sortable: true
    aggregations: []
  currency:
    product_types: ["domestic_bond", "domestic_etf", "domestic_etn", "overseas_etf", "overseas_etn", "public_fund"]
    value_type: "string"
    operators: ["eq", "in"]
    sortable: true
    aggregations: []
  issue_date:
    product_types: ["domestic_bond"]
    value_type: "date"
    operators: ["eq", "gt", "gte", "lt", "lte", "between", "is_missing", "is_not_missing"]
    sortable: true
    aggregations: []
  maturity_date:
    product_types: ["domestic_bond"]
    value_type: "date"
    operators: ["eq", "gt", "gte", "lt", "lte", "between", "is_missing", "is_not_missing"]
    sortable: true
    aggregations: []
  remaining_days_at_as_of:
    metric_id: "bond.remaining_days_at_as_of"
    operators: ["eq", "gt", "gte", "lt", "lte", "between"]
    sortable: true
    aggregations: ["min", "max", "avg"]
  credit_rating:
    metric_id: "bond.credit_rating"
    operators: ["eq", "gte", "lte", "in", "is_missing", "is_not_missing"]
    sortable: true
    aggregations: []
  buy_yield:
    metric_id: "bond.buy_yield"
    operators: ["eq", "gt", "gte", "lt", "lte", "between", "is_missing", "is_not_missing"]
    sortable: true
    aggregations: ["min", "max", "avg"]
  total_fee:
    metric_ids: ["domestic_etf.total_fee", "overseas_etf.total_fee"]
    operators: ["eq", "gt", "gte", "lt", "lte", "between", "is_missing", "is_not_missing"]
    sortable: true
    aggregations: ["min", "max", "avg"]
  aum:
    metric_ids: ["domestic_etf.aum", "overseas_etf.aum", "public_fund.aum"]
    operators: ["eq", "gt", "gte", "lt", "lte", "between", "is_missing", "is_not_missing"]
    sortable: true
    aggregations: ["min", "max", "avg", "sum"]
  tracking_error:
    metric_id: "domestic_etf.tracking_error"
    operators: ["eq", "gt", "gte", "lt", "lte", "between", "is_missing", "is_not_missing"]
    sortable: true
    aggregations: ["min", "max", "avg"]
  return_1m:
    metric_ids: ["domestic_etf.return_1m", "public_fund.return_1m"]
    operators: ["eq", "gt", "gte", "lt", "lte", "between", "is_missing", "is_not_missing"]
    sortable: true
    aggregations: ["min", "max", "avg"]
  return_3m:
    metric_ids: ["domestic_etf.return_3m", "public_fund.return_3m"]
    operators: ["eq", "gt", "gte", "lt", "lte", "between", "is_missing", "is_not_missing"]
    sortable: true
    aggregations: ["min", "max", "avg"]
  return_6m:
    metric_ids: ["domestic_etf.return_6m", "public_fund.return_6m"]
    operators: ["eq", "gt", "gte", "lt", "lte", "between", "is_missing", "is_not_missing"]
    sortable: true
    aggregations: ["min", "max", "avg"]
  return_1y:
    metric_ids: ["domestic_etf.return_1y", "public_fund.return_1y"]
    operators: ["eq", "gt", "gte", "lt", "lte", "between", "is_missing", "is_not_missing"]
    sortable: true
    aggregations: ["min", "max", "avg"]
  return_1d:
    metric_id: "overseas_etf.return_1d"
    operators: ["eq", "gt", "gte", "lt", "lte", "between", "is_missing", "is_not_missing"]
    sortable: true
    aggregations: ["min", "max", "avg"]
  return_1w:
    metric_id: "public_fund.return_1w"
    operators: ["eq", "gt", "gte", "lt", "lte", "between", "is_missing", "is_not_missing"]
    sortable: true
    aggregations: ["min", "max", "avg"]
  return_18m:
    metric_id: "public_fund.return_18m"
    operators: ["eq", "gt", "gte", "lt", "lte", "between", "is_missing", "is_not_missing"]
    sortable: true
    aggregations: ["min", "max", "avg"]
  return_2y:
    metric_id: "public_fund.return_2y"
    operators: ["eq", "gt", "gte", "lt", "lte", "between", "is_missing", "is_not_missing"]
    sortable: true
    aggregations: ["min", "max", "avg"]
  return_3y:
    metric_id: "public_fund.return_3y"
    operators: ["eq", "gt", "gte", "lt", "lte", "between", "is_missing", "is_not_missing"]
    sortable: true
    aggregations: ["min", "max", "avg"]
  return_5y:
    metric_id: "public_fund.return_5y"
    operators: ["eq", "gt", "gte", "lt", "lte", "between", "is_missing", "is_not_missing"]
    sortable: true
    aggregations: ["min", "max", "avg"]
  return_ytd:
    metric_id: "domestic_etf.return_ytd"
    operators: ["eq", "gt", "gte", "lt", "lte", "between", "is_missing", "is_not_missing"]
    sortable: true
    aggregations: ["min", "max", "avg"]
  risk_grade:
    product_types: ["public_fund"]
    value_type: "string"
    operators: ["eq", "in", "is_missing", "is_not_missing"]
    sortable: true
    aggregations: []
  saleable:
    product_types: ["domestic_etf", "domestic_etn", "overseas_etf", "overseas_etn", "public_fund"]
    value_type: "boolean"
    operators: ["eq"]
    sortable: false
    aggregations: []
  mirae_saleable:
    product_types: ["public_fund"]
